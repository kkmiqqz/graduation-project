<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 轨迹压缩系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <style>
        :root {
            --primary-color: #2d7a46;
            --secondary-color: #a8e6cf;
        }

        body {
            background: linear-gradient(135deg, #a8e6cf, #dcedc1);
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding-top: 5rem;
        }

        .history-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .history-header {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
        }

        .table {
            margin-bottom: 0;
        }

        .btn-download {
            background-color: var(--primary-color);
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            background-color: #236137;
            transform: translateY(-1px);
        }

        .btn-delete {
            background-color: #dc3545;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background-color: #bb2d3b;
            transform: translateY(-1px);
        }

        .btn-clear {
            background-color: #dc3545;
            border: none;
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background-color: #bb2d3b;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<div class="history-container">
    <h2 class="history-header mb-4">历史记录</h2>
    <div class="text-end mb-3">
        <button class="btn btn-clear" onclick="clearAllRecords()">清空所有记录</button>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>文件名</th>
            <th>上传时间</th>
            <th>压缩时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="historyTableBody">
        <!-- 历史记录将动态插入这里 -->
        </tbody>
    </table>
</div>

<script>
    // 加载历史记录
    function loadHistory() {
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('historyTableBody');
                tableBody.innerHTML = ''; // 清空现有内容
                data.forEach(record => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${record.filename}</td>
                        <td>${record.uploadTime}</td>
                        <td>${record.compressTime}</td>
                        <td>
                            <button class="btn btn-download me-2" onclick="downloadFile(${record.id})">
                                下载
                            </button>
                            <button class="btn btn-delete" onclick="deleteRecord(${record.id})">
                                删除
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('获取历史记录失败:', error);
                alert('获取历史记录失败: ' + error.message);
            });
    }

    // 下载文件
    function downloadFile(id) {
        window.location.href = `/api/download/${id}`;
    }

    // 删除单条记录
    function deleteRecord(id) {
        if (!confirm('确定要删除此记录吗？')) return;
        fetch(`/api/history/${id}`, {
            method: 'DELETE'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('删除失败');
                }
                loadHistory(); // 刷新列表
            })
            .catch(error => {
                console.error('删除记录失败:', error);
                alert('删除记录失败: ' + error.message);
            });
    }

    // 清空所有记录
    function clearAllRecords() {
        if (!confirm('确定要清空所有历史记录吗？此操作不可恢复！')) return;
        fetch('/api/history', {
            method: 'DELETE'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('清空失败');
                }
                loadHistory(); // 刷新列表
            })
            .catch(error => {
                console.error('清空历史记录失败:', error);
                alert('清空历史记录失败: ' + error.message);
            });
    }

    // 页面加载时获取历史记录
    document.addEventListener('DOMContentLoaded', loadHistory);
</script>
</body>
</html>
