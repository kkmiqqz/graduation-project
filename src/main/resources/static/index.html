<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轨迹数据压缩系统</title>

    <!-- 核心依赖 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- 自定义样式 -->
    <style>
        :root {
            --primary-color: #2d7a46;
            --secondary-color: #a8e6cf;
        }

        body {
            background: linear-gradient(135deg, #a8e6cf, #dcedc1);
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .main-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .card-header {
            background: var(--primary-color);
            padding: 1.5rem;
        }

        .nav-tabs {
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .nav-tabs .nav-link {
            border: none;
            color: #6c757d;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-tabs .nav-link.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .drop-zone {
            border: 2px dashed #ced4da;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary-color);
            background: rgba(40, 167, 69, 0.05);
        }

        .metric-card {
            background: white;
            border-radius: 0.8rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .result-card {
            margin-top: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .result-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 新增地图样式 */
        #mapPreview {
            height: 300px;
            border-radius: 0.8rem;
            margin-top: 1rem;
            z-index: 1;
        }

        /* 图标放大 */
        .bi {
            font-size: 1.5em;
            vertical-align: middle;
        }

        .drop-zone .bi {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 文件信息显示 */
        .file-info {
            margin-top: 1rem;
            font-size: 0.9em;
            color: var(--primary-color);
        }

        /* 统一按钮颜色 */
        .btn-success {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="main-card card">
        <!-- 头部 -->
        <div class="card-header text-center">
            <h1 class="text-white mb-0">
                <i class="bi bi-geo-alt"></i> 轨迹数据压缩系统
            </h1>
        </div>

        <!-- 主体内容 -->
        <div class="card-body p-4">
            <!-- 数据源选项卡 -->
            <ul class="nav nav-tabs" id="dataSourceTabs">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#fileTab">
                        <i class="bi bi-file-earmark-arrow-up fs-4"></i> 文件上传
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#apiTab">
                        <i class="bi bi-cloud-download fs-4"></i> API 获取
                    </a>
                </li>
            </ul>

            <!-- 选项卡内容 -->
            <div class="tab-content mt-4">
                <!-- 文件上传板块 -->
                <div class="tab-pane fade show active" id="fileTab">
                    <div class="drop-zone p-5 text-center" id="dropZone">
                        <i class="bi bi-cloud-arrow-up"></i>
                        <h4 class="mt-3 text-muted">拖放文件到此区域</h4>
                        <p class="text-muted mb-0">支持格式: .txt, .plt, .csv, .xls, .xlsx</p>
                        <input type="file" class="form-control d-none" id="fileInput" accept=".txt,.plt,.csv,.xls,.xlsx">
                        <div class="file-info" id="fileInfo"></div>
                    </div>
                </div>

                <!-- API 获取板块 -->
                <div class="tab-pane fade" id="apiTab">
                    <div class="input-group">
                        <input type="url" class="form-control" placeholder="输入 GPS 数据 API 地址"
                               aria-label="API 地址" id="apiUrl">
                        <button class="btn btn-outline-success" type="button" id="fetchApiData">
                            <i class="bi bi-cloud-download"></i> 获取数据
                        </button>
                    </div>
                </div>
            </div>

            <!-- 新增地图预览 -->
            <div class="mt-4">
                <h5 class="mb-3"><i class="bi bi-map"></i> 轨迹预览</h5>
                <div id="mapPreview"></div>
            </div>

            <!-- 操作按钮 -->
            <div class="d-grid mt-4">
                <button class="btn btn-success btn-lg" id="compressBtn">
                    <span class="spinner-border spinner-border-sm d-none" id="loadingSpinner"></span>
                    <i class="bi bi-lightning-charge"></i> 开始压缩
                </button>
            </div>
        </div>
    </div>

    <!-- 结果展示 -->
    <div class="main-card card result-card mt-4" id="resultCard">
        <div class="card-header bg-success text-white">
            <h3 class="card-title mb-0"><i class="bi bi-graph-up"></i> 压缩结果</h3>
        </div>
        <div class="card-body p-4">
            <!-- 性能指标网格 -->
            <div class="row g-3" id="statsResult">
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="metric-value" id="totalPoints">0</div>
                        <div class="metric-label">总处理点数</div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="metric-value" id="compressTime">0.0000</div>
                        <div class="metric-label">平均压缩时间 (ms)</div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="metric-value" id="decompressTime">0.0000</div>
                        <div class="metric-label">平均解压时间 (ms)</div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="metric-value" id="compressionRatio">0.0000</div>
                        <div class="metric-label">压缩比</div>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button class="btn btn-success" id="downloadBtn">
                    <i class="bi bi-download"></i> 下载压缩文件
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 脚本依赖 -->
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 自定义交互脚本 -->
<script>
    // 初始化地图
    const map = L.map('mapPreview').setView([39.9042, 116.4074], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 文件拖放处理
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');

    // 更新文件信息显示
    function updateFileInfo(file) {
        fileInfo.innerHTML = `
            <i class="bi bi-file-earmark-check"></i>
            已选择文件：${file.name} (${(file.size/1024).toFixed(2)}KB)
        `;
    }

    // 点击触发文件选择
    dropZone.addEventListener('click', () => fileInput.click());

    // 拖放处理
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.style.backgroundColor = 'rgba(45, 122, 70, 0.1)';
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.style.backgroundColor = '';
        });
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        fileInput.files = dt.files;
        if (dt.files.length) {
            updateFileInfo(dt.files[0]);
        }
    });

    // 文件选择变化处理
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            updateFileInfo(e.target.files[0]);
        }
    });

    // 压缩处理
    document.getElementById('compressBtn').addEventListener('click', async () => {
        const files = fileInput.files;
        if (!files.length) return alert('请选择文件');

        const spinner = document.getElementById('loadingSpinner');
        const resultCard = document.getElementById('resultCard');

        spinner.classList.remove('d-none');
        resultCard.classList.remove('show');

        try {
            const formData = new FormData();
            formData.append('file', files[0]);

            const response = await fetch('http://localhost:8080/api/compress', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // 更新性能指标
            document.getElementById('totalPoints').textContent = data.compressionResult.totalPoints;
            document.getElementById('compressTime').textContent =
                data.compressionResult.averageCompressTime.toFixed(6);
            document.getElementById('decompressTime').textContent =
                data.compressionResult.averageDecompressTime.toFixed(6);
            document.getElementById('compressionRatio').textContent =
                data.compressionResult.compressionRatio.toFixed(6);

            // 显示下载按钮
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = `data:application/octet-stream;base64,${data.downloadFileBase64}`;
                link.download = 'compressed.bin';
                link.click();
            };

            resultCard.classList.add('show');
        } catch (error) {
            alert(`压缩失败: ${error.message}`);
        } finally {
            spinner.classList.add('d-none');
        }
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }
</script>
</body>
</html>
