<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 轨迹压缩系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <style>
        :root {
            --primary-color: #2d7a46;
            --secondary-color: #a8e6cf;
        }

        body {
            background: linear-gradient(135deg, #a8e6cf, #dcedc1);
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(45, 122, 70, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #236137;
            transform: translateY(-1px);
        }

        .nav-link {
            color: var(--primary-color);
            font-weight: 500;
        }

        .nav-link:hover {
            color: #1d4d2f;
        }

        .alert {
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <h2 class="auth-header mb-4">用户登录</h2>

    <form id="loginForm">
        <!-- 用户名输入 -->
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input
                    type="text"
                    class="form-control"
                    name="username"
                    required
                    placeholder="请输入用户名"
                    autocomplete="username"
            >
        </div>

        <!-- 密码输入 -->
        <div class="mb-4">
            <label class="form-label">密码</label>
            <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                    placeholder="请输入密码"
                    autocomplete="current-password"
            >
        </div>

        <!-- 登录按钮 -->
        <button type="submit" class="btn btn-primary w-100">
            立即登录
        </button>

        <!-- 底部导航 -->
        <div class="mt-4 text-center">
            <span>没有账号？</span>
            <a href="register.html" class="nav-link d-inline-block">去注册</a>
        </div>
    </form>

    <!-- 提示信息 -->
    <div class="alert alert-success" role="alert" id="successAlert">
        登录成功！3秒后跳转到主页
    </div>
    <div class="alert alert-danger" role="alert" id="errorAlert"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // 隐藏之前的提示
        document.querySelectorAll('.alert').forEach(alert => alert.style.display = 'none');

        // 获取表单数据
        const formData = new FormData(document.getElementById('loginForm'));

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                body: formData
            });

            const result = await response.text();

            if (response.ok) {
                // 显示成功提示
                document.getElementById('successAlert').style.display = 'block';
                // 3秒后跳转
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 3000);
            } else {
                // 显示错误提示
                document.getElementById('errorAlert').textContent = result;
                document.getElementById('errorAlert').style.display = 'block';
            }
        } catch (error) {
            console.error('登录失败:', error);
            document.getElementById('errorAlert').textContent = '网络错误，请稍后重试';
            document.getElementById('errorAlert').style.display = 'block';
        }
    });

    // 输入框实时验证
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', () => {
            document.querySelectorAll('.alert').forEach(alert => alert.style.display = 'none');
        });
    });
</script>
</body>
</html>
